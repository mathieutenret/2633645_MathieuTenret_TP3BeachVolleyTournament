{% extends 'base.html' %}
<!-- Chargement des outils de traduction (Point 7) -->
{% load i18n %}
<!-- Traduction du titre de la page à l'aide de {% trans "..." %} (Point 7) -->
{% block title %}{% trans "Modification de l'utilisateur" %}{% endblock %}

<!-- Traduction des boutons et des textes à l'aide de {% trans "..." %} (Point 7)-->
{% block content %}
<div class="container-fluid member-app">
    <div class="row">
        <div class="col-md-10 col-lg-8 mx-auto">
            <h2>{% trans "Modification de l'utilisateur" %}</h2>
            <br />

            <form method="POST">
                <div class="form-group">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <p><a href="{% url 'forget_password' %}">{% trans "Modifier votre mot de passe" %}</a></p>
                    <a href="{% url 'login' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
                    <button type="submit" class="btn btn-primary">{% trans "Valider les modifications" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
