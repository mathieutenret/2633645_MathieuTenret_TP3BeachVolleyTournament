{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Volley Tournament</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'CSS/style.css' %}" rel="stylesheet">
    <script src="{% static 'JS/script.js' %}" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Beach Volley</a>

            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'home' %}">Accueil</a>
                
                <a class="nav-link" href="{% url 'tournament_list' %}">Tournois</a>

                <a class="nav-link" href="{% url 'create_team_one' %}">Équipe 1 joueur</a>

                <a class="nav-link" href="{% url 'create_team_two' %}">Équipe 2 joueurs</a>

                <a class="nav-link" href="{% url 'about' %}">À propos</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-{{ m.tags }}">
                    {{ m }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
